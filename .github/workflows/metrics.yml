name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  github-metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # Create a classic PAT (no scopes required for public metrics) and
          # store it as repository secret METRICS_TOKEN. GITHUB_TOKEN is too
          # limited for this action.
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          filename: metrics.svg
          output_action: commit
          committer_branch: output
          committer_message: Update GitHub metrics
          base: header, activity, community, repositories, metadata
          config_timezone: America/Chicago
