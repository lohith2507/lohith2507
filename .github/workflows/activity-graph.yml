name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/activity-graph.yml"

jobs:
  build-graph:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: bg_color=1a1b27&color=58a6ff&line=58a6ff&point=58a6ff&area_color=29454e&area=true&hide_border=true&custom_title=Commit%20Activity
          output_path: github-readme-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add github-readme-activity-graph.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update GitHub activity graph"
          git pull --rebase origin output || true
          git push origin HEAD:output
