name: Language Distribution Chart

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/language-chart.yml"

jobs:
  generate-language-chart:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Generate language chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python3 << 'EOF'
          import base64
          import os

          import matplotlib.pyplot as plt
          import requests

          username = os.getenv("USERNAME")
          token = os.getenv("GITHUB_TOKEN")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          }

          repos = requests.get(
              f"https://api.github.com/users/{username}/repos?type=owner&per_page=100",
              headers=headers,
              timeout=30,
          )
          repos.raise_for_status()
          repos = repos.json()

          languages = {}
          for repo in repos:
              if repo.get("fork"):
                  continue
              lang_resp = requests.get(repo["languages_url"], headers=headers, timeout=30)
              lang_resp.raise_for_status()
              for lang, bytes_count in lang_resp.json().items():
                  languages[lang] = languages.get(lang, 0) + bytes_count

          if not languages:
              raise SystemExit("No language data found")

          sorted_langs = sorted(languages.items(), key=lambda x: x[1], reverse=True)[:10]
          langs = [item[0] for item in sorted_langs]
          values = [item[1] for item in sorted_langs]

          fig, ax = plt.subplots(figsize=(12, 7), facecolor="#0d1117")
          ax.set_facecolor("#0d1117")
          colors = [
              "#58a6ff", "#79c0ff", "#a371f7", "#d296ff", "#ffa657",
              "#ff7b72", "#ff6e40", "#ffa28b", "#7ee787", "#56d364",
          ]
          wedges, texts, autotexts = ax.pie(
              values,
              labels=langs,
              autopct="%1.1f%%",
              startangle=90,
              colors=colors[: len(langs)],
          )
          for autotext in autotexts:
              autotext.set_color("white")
              autotext.set_fontsize(10)
              autotext.set_fontweight("bold")
          for text in texts:
              text.set_color("white")
              text.set_fontsize(11)
              text.set_fontweight("bold")
          ax.set_title(
              "Language Distribution",
              color="white",
              fontsize=16,
              fontweight="bold",
              pad=20,
          )
          plt.tight_layout()
          plt.savefig("language-chart.png", bbox_inches="tight", facecolor="#0d1117", dpi=100)

          with open("language-chart.png", "rb") as f:
              img_data = base64.b64encode(f.read()).decode()

          svg_content = f'''<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="700" viewBox="0 0 1200 700">
            <image xlink:href="data:image/png;base64,{img_data}" width="1200" height="700" />
          </svg>'''
          with open("language-chart.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)

          print("Language chart generated successfully!")
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add language-chart.svg language-chart.png
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update language distribution chart"
          git pull --rebase origin output || true
          git push origin HEAD:output
